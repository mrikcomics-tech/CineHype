
name: Build

concurrency:
  group: build
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: src

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build plugins
        working-directory: src
        run: |
          chmod +x gradlew
          ./gradlew make makePluginsJson

          mkdir -p "$RUNNER_TEMP/plugin-builds"

          find . -type f -path '*/build/*.cs3' \
            -exec cp {} "$RUNNER_TEMP/plugin-builds/" \;

          cp build/plugins.json "$RUNNER_TEMP/plugin-builds/"

      - name: Prepare builds branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git ls-remote --exit-code --heads "$REPO_URL" builds; then
            git clone --branch builds --single-branch "$REPO_URL" publish
          else
            mkdir publish
            cd publish
            git init -b builds
            git remote add origin "$REPO_URL"
            cd ..
          fi

      - name: Publish plugins
        working-directory: publish
        run: |
          set -e

          find . -maxdepth 1 -type f -name '*.cs3' -delete

          cp "$RUNNER_TEMP"/plugin-builds/*.cs3 . 2>/dev/null || true
          cp "$RUNNER_TEMP"/plugin-builds/plugins.json .

          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Build ${GITHUB_SHA}"
            git push origin builds
          fi
